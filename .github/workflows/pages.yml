name: Deploy to GitHub Pages

# 公開は main への push ではなく、タグ（v*）を打った時に行う。
# main を開発の合流点として動かしても公開物が変わらないようにするため（#544 の切り替えを
# main へのマージと切り離す）。手動実行（workflow_dispatch）は、選んだ ref をそのまま公開する。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYDIST_BASE_PATH: /keydist/
      # 旧画面（Analyzer 再設計 #544 より前の最終形）を /keydist/classic/ に同梱する。
      # ソースは残さず、このタグのコミットをそのままビルドする。旧画面は今後変えないので、
      # 保守するコードを持たない
      CLASSIC_REF: classic-final
      CLASSIC_BASE_PATH: /keydist/classic/
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Checkout classic
        id: checkout-classic
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CLASSIC_REF }}
          path: classic

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Build classic
        id: build-classic
        shell: bash
        working-directory: classic
        env:
          KEYDIST_BASE_PATH: ${{ env.CLASSIC_BASE_PATH }}
        run: |
          set -o pipefail
          {
            npm ci
            npm run build
          } 2>&1 | tee "$RUNNER_TEMP/build-classic.log"
          rm -rf ../.output/public/classic
          cp -R .output/public ../.output/public/classic

      - name: Configure Pages
        id: configure-pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

      - name: Write build summary
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CHECKOUT_CLASSIC_OUTCOME: ${{ steps.checkout-classic.outcome }}
          BUILD_CLASSIC_OUTCOME: ${{ steps.build-classic.outcome }}
          CONFIGURE_PAGES_OUTCOME: ${{ steps.configure-pages.outcome }}
          UPLOAD_PAGES_OUTCOME: ${{ steps.upload-pages.outcome }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              skipped) printf '⏭️' ;;
              cancelled) printf '🚫' ;;
              *) printf '❔' ;;
            esac
          }

          {
            echo "## Pages build summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            printf '| Checkout | %s %s |\n' "$(icon "$CHECKOUT_OUTCOME")" "$CHECKOUT_OUTCOME"
            printf '| Setup Node.js | %s %s |\n' "$(icon "$SETUP_NODE_OUTCOME")" "$SETUP_NODE_OUTCOME"
            printf '| Install dependencies | %s %s |\n' "$(icon "$INSTALL_OUTCOME")" "$INSTALL_OUTCOME"
            printf '| Typecheck | %s %s |\n' "$(icon "$TYPECHECK_OUTCOME")" "$TYPECHECK_OUTCOME"
            printf '| Test | %s %s |\n' "$(icon "$TEST_OUTCOME")" "$TEST_OUTCOME"
            printf '| Build | %s %s |\n' "$(icon "$BUILD_OUTCOME")" "$BUILD_OUTCOME"
            printf '| Checkout classic (%s) | %s %s |\n' "$CLASSIC_REF" "$(icon "$CHECKOUT_CLASSIC_OUTCOME")" "$CHECKOUT_CLASSIC_OUTCOME"
            printf '| Build classic | %s %s |\n' "$(icon "$BUILD_CLASSIC_OUTCOME")" "$BUILD_CLASSIC_OUTCOME"
            printf '| Configure Pages | %s %s |\n' "$(icon "$CONFIGURE_PAGES_OUTCOME")" "$CONFIGURE_PAGES_OUTCOME"
            printf '| Upload Pages artifact | %s %s |\n' "$(icon "$UPLOAD_PAGES_OUTCOME")" "$UPLOAD_PAGES_OUTCOME"
            echo
            echo "[Open full run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

          append_failure_log() {
            local title="$1"
            local outcome="$2"
            local log_file="$3"

            if [ "$outcome" != "failure" ] || [ ! -s "$log_file" ]; then
              return
            fi

            {
              echo
              echo "<details open>"
              echo "<summary>❌ $title — last 80 log lines</summary>"
              echo
              echo '~~~text'
              tail -n 80 "$log_file"
              echo '~~~'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          append_failure_log "Install dependencies" "$INSTALL_OUTCOME" "$RUNNER_TEMP/npm-ci.log"
          append_failure_log "Typecheck" "$TYPECHECK_OUTCOME" "$RUNNER_TEMP/typecheck.log"
          append_failure_log "Test" "$TEST_OUTCOME" "$RUNNER_TEMP/test.log"
          append_failure_log "Build" "$BUILD_OUTCOME" "$RUNNER_TEMP/build.log"
          append_failure_log "Build classic" "$BUILD_CLASSIC_OUTCOME" "$RUNNER_TEMP/build-classic.log"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write deploy summary
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          case "$DEPLOY_OUTCOME" in
            success) icon='✅' ;;
            failure) icon='❌' ;;
            skipped) icon='⏭️' ;;
            cancelled) icon='🚫' ;;
            *) icon='❔' ;;
          esac

          {
            echo "## Pages deploy summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            printf '| Deploy Pages | %s %s |\n' "$icon" "$DEPLOY_OUTCOME"
            echo
            echo "[Open full run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
