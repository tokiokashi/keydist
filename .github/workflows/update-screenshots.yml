name: Update Screenshots

# スクリーンショットの基準の画像（e2e/screenshots/）を作り直し、artifactとして上げる。
# 基準の画像はCIの `browser-e2e` と同じ環境（runner・Node・Chromium・`CI=1`・本番ビルドとpreview）で作らないと、
# 描画の1画素のずれで比較が落ちる。そのため手元では作らず、このworkflowが作る。
# ブランチへのコミットはこのworkflowからは行わない。`GITHUB_TOKEN` によるpushでは他のworkflow（CI）が起動せず、
# 取り込んだコミットのheadに `browser-e2e` のcheck runが付かないため。artifactを取ってコミットする（CONTRIBUTING.md「ブラウザe2e」）。
#
# 起動の仕方は2つ。
#  - PRにラベル `update-screenshots` を付ける（PRのmerge commitで作る。`browser-e2e` と同じ入力）。
#    作り直しをもう一度したい時は、ラベルを外してから付け直す
#  - Actions画面の「Run workflow」。`workflow_dispatch` は、このファイルが既定のブランチにある時だけ使える
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # e2e.ymlのe2e-shardと同じ手順にする
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm_version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          (cd "$RUNNER_TEMP" && npm install --global "npm@$npm_version")
          npm --version
          npm ci

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps --only-shell chromium

      # CI=1にして、playwright.config.tsの本番ビルドとpreviewの配信を `browser-e2e` と揃える。
      # 古い画像が残らないよう、いったん消してから全部作り直す
      - name: Update screenshots
        shell: bash
        env:
          CI: '1'
        run: |
          rm -rf e2e/screenshots
          npx playwright test e2e/visual-figures.spec.ts --update-snapshots all

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Update Screenshots"
            echo
            echo "artifact \`screenshots\` の中身を、リポジトリの \`e2e/screenshots/\` に置いてコミットする。"
            echo
            find e2e/screenshots -type f | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
