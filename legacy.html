<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keydist — キーボード配列指移動距離</title>
    <meta name="description" content="キーボード論理配列を指の総移動距離で評価する" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>keydist</h1>
      <p class="lede">
        論理配列を打った時の指の総移動距離で評価する
        <span id="analyzer-dialog-actions"></span>
      </p>
      <div class="spacer"></div>
      <div id="analyzer-theme-controls" class="theme-toggle-slot"></div>
    </header>

    <div class="app" id="app">
      <aside class="sidebar">
        <div class="panel">
          <h2>入力</h2>

          <div id="analyzer-mode-control"></div>

          <div id="analyzer-sidebar-controls"></div>
        </div>

        <div id="analyzer-geometry-panel"></div>
        <div id="analyzer-add-panel"></div>
      </aside>

      <div class="stack">
        <div id="analyzer-text-panel"></div>

        <section class="panel">
          <h2>配列の詳細</h2>
          <p class="note metric-conditions" id="detail-conditions"></p>
          <div id="playback"></div>
          <div class="fig-fixed" id="heatmap"></div>
          <div class="split">
            <div>
              <h3>指ごとの移動距離 [u]<button type="button" class="info" data-tip="文章を打ち切るまでに各指が動いた距離。短い経路を選んだ場合はその分短縮される。" aria-label="文章を打ち切るまでに各指が動いた距離。短い経路を選んだ場合はその分短縮される。">i</button></h3>
              <div id="finger-chart"></div>
              <p class="note">親指の距離は常に0なので省く。押下数は図にかざすと出る。</p>
            </div>
            <div>
              <h3>指間距離の標準偏差 [u]<button type="button" class="info" data-tip="指間距離のばらつき。平均が同じでも、常に一定の開き方をするか打鍵ごとに変わるかで差が出る。" aria-label="指間距離のばらつき。平均が同じでも、常に一定の開き方をするか打鍵ごとに変わるかで差が出る。">i</button></h3>
              <div id="adjacent-chart"></div>
            </div>
          </div>
          <div id="analyzer-bigram-flow"></div>
        </section>

        <section class="panel compare-panel">
          <h2>総移動距離<button type="button" class="info" data-tip="全指の移動距離の合計。ホームポジションからどれだけ移動したかの指標。" aria-label="全指の移動距離の合計。ホームポジションからどれだけ移動したかの指標。">i</button></h2>
          <div id="analyzer-comparison-controls"></div>
          <div id="compare-chart"></div>
          <div class="scroll-x"><table id="compare"></table></div>
          <p class="note">
            総移動距離は小さい候補を採った下界。実際の運指はこれ以上になる。
          </p>
        </section>

        <section class="panel">
          <h2>配列 × 指のマトリックス</h2>
          <div class="split-wrap">
            <div>
              <h3>指ごとの押下数 [押下/文字]<button type="button" class="info" data-tip="1文字を出力するのに必要な打鍵数。同時押しは押した数だけ数える。" aria-label="1文字を出力するのに必要な打鍵数。同時押しは押した数だけ数える。">i</button></h3>
              <div class="fig-fixed" id="press-matrix"></div>
            </div>
            <div>
              <h3>指ごとの移動距離 [u/文字]<button type="button" class="info" data-tip="各指が動いた距離を入力文字数で割った値。1文字を出力するのに必要な指の平均移動距離。" aria-label="各指が動いた距離を入力文字数で割った値。1文字を出力するのに必要な指の平均移動距離。">i</button></h3>
              <div class="fig-fixed" id="finger-matrix"></div>
            </div>
            <div>
              <h3>指間距離の平均 [u]<button type="button" class="info" data-tip="隣り合う2本の指の距離を全打鍵で平均し、両方がホームにある時の距離を引いた値。両指ともホームから一度も動かなければ0。平均的な指同士の間隔。" aria-label="隣り合う2本の指の距離を全打鍵で平均し、両方がホームにある時の距離を引いた値。両指ともホームから一度も動かなければ0。平均的な指同士の間隔。">i</button></h3>
              <div class="fig-fixed" id="adjacent-mean-matrix"></div>
            </div>
            <div>
              <h3>指間距離の標準偏差 [u]<button type="button" class="info" data-tip="指間距離のばらつき。平均が同じでも、常に一定の開き方をするか打鍵ごとに変わるかで差が出る。" aria-label="指間距離のばらつき。平均が同じでも、常に一定の開き方をするか打鍵ごとに変わるかで差が出る。">i</button></h3>
              <div class="fig-fixed" id="adjacent-stddev-matrix"></div>
            </div>
          </div>
          <p class="note">
            距離と押下数は文字数で割った値。色は図ごとの強弱を示す。<br />
            隣接指の間隔はホーム時を0として測る。ばらつきは打鍵中の間隔の変動。
          </p>
        </section>

        <div id="analyzer-sensitivity-panel"></div>
      </div>
      <aside id="playback-settings-panel" class="playback-settings-aside" aria-label="打鍵再生設定"></aside>
    </div>

    <dialog id="how-dialog"></dialog>

    <dialog id="conditions-dialog"></dialog>

    <dialog id="geometry-dialog"></dialog>

    <dialog id="romaji-dialog"></dialog>

    <dialog id="playback-calibration-dialog"></dialog>

    <div id="analyzer-react-shell" hidden></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <footer><a href="https://github.com/tokiokashi/keydist">GitHub</a></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
